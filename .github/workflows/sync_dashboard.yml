name: Sincronizar Dashboard

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: vm-intelligence-dashboard-sync
  cancel-in-progress: false

jobs:
  sync-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: project-a79a6dd3-0de4-4745-aab
          workload_identity_provider: projects/970826925038/locations/global/workloadIdentityPools/github-actions/providers/vm-intelligence-github
          service_account: vm-intelligence-backup@project-a79a6dd3-0de4-4745-aab.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Gerar dados públicos sanitizados
        env:
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
        run: python scripts/sync_dashboard.py

      - name: Publicar atualização
        run: |
          if git diff --quiet -- data/dashboard.json; then
            echo "Nenhuma alteração nos indicadores."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dashboard.json
          git commit -m "data: sincroniza indicadores do dashboard"
          git push
